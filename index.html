<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@theftfelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Подключение темы MD3 -->
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">@theftfelt</h1>
            <p class="subtitle">Минимализм и функциональность</p>
            <!-- Переключатель темы -->
            <div class="theme-switcher">
                <label for="theme-select">Тема:</label>
                <select id="theme-select">
                    <option value="system">Системная</option>
                    <option value="light">Светлая</option>
                    <option value="dark">Тёмная</option>
                </select>
            </div>
        </header>

        <main>
            <section class="hero">
                <p>Добро пожаловать на мой сайт. Здесь ты найдёшь всё, что нужно.</p>
                <button class="md3-button">Узнать больше</button>
            </section>

            <section class="content">
                <div class="card">
                    <h2>Обо мне</h2>
                    <p>Я занимаюсь дизайном и разработкой. Мои работы основаны на принципах Material Design.</p>
                </div>
                <div class="card">
                    <h2>Проекты</h2>
                    <p>Посмотри мои последние проекты и идеи.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Связаться со мной:</p>
            <div class="social-links">
                <a href="mailto:theftfelt@example.com" class="social-link">Email</a>
                <a href="https://t.me/theftfelt" class="social-link">Telegram</a>
                <a href="https://github.com/tumka3310-cyber" class="social-link">GitHub</a>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <!-- Управление темой -->
    <script src="theme.js" defer></script>
</body>
</html>
